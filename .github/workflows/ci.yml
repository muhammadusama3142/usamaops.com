name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}/dist" "dist/**/*.html"
          fail: true

      - name: Guard the security headers
        run: |
          grep -q "Content-Security-Policy" dist/_headers
          grep -q "Strict-Transport-Security" dist/_headers
          # Inline style attributes would be blocked by the CSP, so fail the build if any slip in.
          if grep -rl 'style="' dist --include='*.html'; then echo "Inline style attribute found"; exit 1; fi
